name: update-package
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Update package
        run: nix run nixpkgs#nix-update -- --flake nomad --build

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/nomad
          title: "nomad: update to latest release"
          commit-message: "nomad: update to latest release"
          delete-branch: true

      - name: Merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch
